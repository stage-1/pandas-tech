<!doctype html>
<html><head><meta charset="utf-8"><title>Priority badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}
.card{width:700px;background:#fff;padding:24px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;border:1px solid;font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
.dot{width:8px;height:8px;border-radius:50%;}
.solid{padding:6px 12px;border-radius:6px;font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#fff;}
</style></head><body>
<div class="card">
  <span class="badge" style="background:#FDEAEA;border-color:#F29090;color:#7A1010;"><span class="dot" style="background:#C01E1E;"></span>Crítico</span>
  <span class="badge" style="background:#FFF6E6;border-color:#FAD888;color:#7A5205;"><span class="dot" style="background:#C48A08;"></span>Medio</span>
  <span class="badge" style="background:#EDF2F8;border-color:#94B5D8;color:#1A3650;"><span class="dot" style="background:#30597C;"></span>Bajo</span>
  <span class="badge" style="background:#EDF7EE;border-color:#9DD4A2;color:#1D5C22;"><span class="dot" style="background:#2E8B36;"></span>Hecho</span>
  <span class="badge" style="background:#F0EDE8;border-color:#E6E2DB;color:#3E3C38;"><span class="dot" style="background:#706D66;"></span>Pendiente</span>

  <span class="solid" style="background:#C01E1E;">Crítico</span>
  <span class="solid" style="background:#C48A08;">Medio</span>
  <span class="solid" style="background:#30597C;">Bajo</span>
  <span class="solid" style="background:#2E8B36;">Hecho</span>
</div>
</body></html>
