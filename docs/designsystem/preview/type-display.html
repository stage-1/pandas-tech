<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}
.card{width:700px;background:#fff;padding:24px;box-sizing:border-box;}
.row{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--border-default);}
.row:last-child{border-bottom:0;}
.spec{font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:140px;flex-shrink:0;}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="spec">Barlow 48 / 700</div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:48px;line-height:1.1;letter-spacing:0.06em;text-transform:uppercase;">Cotización 0241</div>
  </div>
  <div class="row">
    <div class="spec">Barlow 36 / 700</div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1.1;letter-spacing:0.06em;text-transform:uppercase;">Panda Automotriz</div>
  </div>
  <div class="row">
    <div class="spec">Barlow 14 / 500</div>
    <div style="font-family:var(--font-display);font-weight:500;font-size:14px;letter-spacing:0.10em;text-transform:uppercase;color:var(--fg2);">Centro de mantenimiento</div>
  </div>
</div>
</body></html>
