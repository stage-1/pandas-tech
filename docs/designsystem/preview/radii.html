<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}
.card{width:700px;background:#fff;padding:24px;box-sizing:border-box;display:flex;gap:14px;justify-content:space-between;align-items:flex-end;}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
.box{width:72px;height:72px;background:var(--red-600);border:1px solid var(--red-800);}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--fg2);}
.px{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
</style></head><body>
<div class="card">
  <div class="col"><div class="box" style="border-radius:0;"></div><div class="tok">none</div><div class="px">0</div></div>
  <div class="col"><div class="box" style="border-radius:4px;"></div><div class="tok">sm</div><div class="px">4 px</div></div>
  <div class="col"><div class="box" style="border-radius:6px;"></div><div class="tok">md</div><div class="px">6 px</div></div>
  <div class="col"><div class="box" style="border-radius:8px;"></div><div class="tok">lg</div><div class="px">8 px</div></div>
  <div class="col"><div class="box" style="border-radius:12px;"></div><div class="tok">xl</div><div class="px">12 px</div></div>
  <div class="col"><div class="box" style="border-radius:16px;"></div><div class="tok">2xl</div><div class="px">16 px</div></div>
  <div class="col"><div class="box" style="border-radius:9999px;"></div><div class="tok">full</div><div class="px">pill</div></div>
</div>
</body></html>
