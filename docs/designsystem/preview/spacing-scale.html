<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing · 4px grid</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;}
.card{width:700px;background:#fff;padding:24px;box-sizing:border-box;}
.row{display:flex;align-items:center;gap:12px;padding:5px 0;}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:60px;}
.bar{background:var(--red-600);height:14px;border-radius:2px;}
.px{font-family:var(--font-mono);font-size:11px;color:var(--fg2);}
</style></head><body>
<div class="card">
  <div class="row"><div class="tok">sp-1</div><div class="bar" style="width:4px;"></div><div class="px">4 px</div></div>
  <div class="row"><div class="tok">sp-2</div><div class="bar" style="width:8px;"></div><div class="px">8 px</div></div>
  <div class="row"><div class="tok">sp-3</div><div class="bar" style="width:12px;"></div><div class="px">12 px</div></div>
  <div class="row"><div class="tok">sp-4</div><div class="bar" style="width:16px;"></div><div class="px">16 px</div></div>
  <div class="row"><div class="tok">sp-5</div><div class="bar" style="width:20px;"></div><div class="px">20 px</div></div>
  <div class="row"><div class="tok">sp-6</div><div class="bar" style="width:24px;"></div><div class="px">24 px</div></div>
  <div class="row"><div class="tok">sp-8</div><div class="bar" style="width:32px;"></div><div class="px">32 px</div></div>
  <div class="row"><div class="tok">sp-10</div><div class="bar" style="width:40px;"></div><div class="px">40 px</div></div>
  <div class="row"><div class="tok">sp-12</div><div class="bar" style="width:48px;"></div><div class="px">48 px</div></div>
  <div class="row"><div class="tok">sp-16</div><div class="bar" style="width:64px;"></div><div class="px">64 px</div></div>
</div>
</body></html>
