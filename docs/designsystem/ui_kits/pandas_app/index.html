<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panda Automotriz — UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #2A2926; min-height: 100vh; font-family: 'DM Sans', system-ui, sans-serif; }
  .stage {
    display: flex; gap: 24px; padding: 32px;
    align-items: flex-start; justify-content: center;
    flex-wrap: wrap;
  }
  .phone {
    width: 390px; height: 780px;
    background: #fff; border-radius: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    overflow: hidden; position: relative;
    border: 8px solid #141412;
  }
  .phone-inner { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .phone-label {
    text-align: center; margin-top: 12px;
    font-family: 'Barlow Condensed'; font-weight: 700;
    font-size: 14px; letter-spacing: 0.10em;
    text-transform: uppercase; color: #9A9790;
  }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/Primitives.jsx"></script>
<script type="text/babel" src="components/Workshop.jsx"></script>
<script type="text/babel" src="components/Screens.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  function Phone({ label, children }) {
    return (
      <div>
        <div className="phone"><div className="phone-inner">{children}</div></div>
        <div className="phone-label">{label}</div>
      </div>
    );
  }

  function App() {
    const [screen, setScreen] = useState('kanban');
    const [activeRO, setActiveRO] = useState(null);
    useEffect(() => { window.lucide && window.lucide.createIcons(); });

    const heroRO = SEED_ROS.find(r => r.id === '0241');

    return (
      <div className="stage">
        <Phone label="Tablero · Kanban">
          <KanbanScreen onSelect={(ro) => { setActiveRO(ro); setScreen('ro'); }} />
        </Phone>
        <Phone label="Orden de trabajo · OT‑0241">
          <ROScreen ro={heroRO} onBack={() => {}} onPrint={() => {}} />
        </Phone>
        <Phone label="Vista previa PDF">
          <PDFPreview ro={heroRO} onBack={() => {}} />
        </Phone>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
